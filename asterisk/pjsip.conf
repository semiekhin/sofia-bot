; =============================================
; PJSIP Configuration — Sofia Voice (Telphin)
; =============================================

; --- Transport: нестандартный порт 5090 ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5090

; --- Регистрация на Телфин ---
[telphin]
type=registration
transport=transport-udp
outbound_auth=telphin-auth
server_uri=sip:sipproxy.telphin.ru:5068
client_uri=sip:15400*101@sipproxy.telphin.ru:5068
retry_interval=30
expiration=60
line=yes
endpoint=telphin-endpoint

[telphin-auth]
type=auth
auth_type=userpass
username=15400*101
password=jAJk6585e

; --- AOR (Address of Record) ---
[telphin-aor]
type=aor
contact=sip:sipproxy.telphin.ru:5068
qualify_frequency=30

; --- Endpoint для входящих/исходящих ---
[telphin-endpoint]
type=endpoint
transport=transport-udp
context=from-telphin
disallow=all
allow=alaw
allow=ulaw
outbound_auth=telphin-auth
aors=telphin-aor
from_user=15400*101
from_domain=sipproxy.telphin.ru
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no
ice_support=no
media_encryption=no
; Нет DTLS/SRTP — Телфин не поддерживает

; --- Identify: определяем входящие от Телфин по IP ---
[telphin-identify]
type=identify
endpoint=telphin-endpoint
match=sipproxy.telphin.ru
