[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

[from-telphin]
exten => s,1,NoOp(=== Incoming call: ${CALLERID(num)} ===)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Set(CALL_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:9090)
 same => n,Hangup()

exten => _X.,1,Goto(s,1)

[outbound-audiosocket]
; Entered when an outbound originate leg answers (triggered by dial.py).
; AudioSocket app requires a RFC-4122 UUID — Asterisk's ${UNIQUEID}
; (<epoch>.<counter>) is NOT a valid UUID and was rejected with
; "Failed to parse UUID". Mirror of [from-telphin]: generate a fresh
; UUID via kernel random. CDR<->AudioSocket correlation still works
; via CDR.lastdata which contains the UUID passed to AudioSocket.
exten => s,1,NoOp(=== Outbound call answered ===)
 same => n,Set(CALL_UUID=${SHELL(cat /proc/sys/kernel/random/uuid | tr -d '\n')})
 same => n,AudioSocket(${CALL_UUID},127.0.0.1:9090)
 same => n,Hangup()
