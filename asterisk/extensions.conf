; =============================================
; Dialplan — Sofia Voice
; =============================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

; --- Входящие от Телфин ---
[from-telphin]
; Телфин может отправлять разные exten: s, номер добавочного, или полный номер
exten => s,1,NoOp(=== Incoming call from Telphin: ${CALLERID(num)} ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Wait(1)
 same => n,Hangup()

exten => _X.,1,NoOp(=== Incoming call from Telphin: ${CALLERID(num)} to ${EXTEN} ===)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Playback(hello-world)
 same => n,Wait(1)
 same => n,Hangup()
